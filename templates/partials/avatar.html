{% if person.profile_photo %}<img src="{{ person.profile_photo.url }}" alt="" class="avatar avatar-size-{{ size|default:40 }}" width="{{ size|default:40 }}" height="{{ size|default:40 }}">{% else %}<span class="avatar avatar-initials avatar-size-{{ size|default:40 }}" aria-hidden="true">{% if person.first_name or person.last_name %}{{ person.first_name|first|upper }}{{ person.last_name|first|upper }}{% else %}{{ person.username|first|upper }}{% endif %}</span>{% endif %}
