{% extends "base.html" %}

{% block title %}Log in · LexiTrace{% endblock %}

{% block content %}
<section class="container">
  <div class="lt-auth-shell">
    <div class="card">
      <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
          <span class="feature-icon mb-3" aria-hidden="true"><i class="bi bi-box-arrow-in-right"></i></span>
          <h1 class="h3 fw-bold mb-2">Welcome back</h1>
          <p class="text-body-secondary mb-0">Log in with your username or email to pick up where you left off.</p>
        </div>

        <form method="post" action="{% url 'accounts:login' %}" novalidate>
          {% csrf_token %}
          {% include "partials/form_fields.html" with form=form %}
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">Log in</button>
        </form>

        <p class="text-center text-body-secondary mt-4 mb-0">Don&rsquo;t have an account? <a href="{% url 'accounts:register' %}">Sign up</a></p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
