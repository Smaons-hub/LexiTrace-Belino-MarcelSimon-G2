<article class="card h-100 vault-card">
  <div class="card-body p-4">
    <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
      <h2 class="vault-card-title vault-word mb-0">
        <a class="stretched-link vault-card-link" href="{% url 'vault:detail' entry.pk %}">{{ entry.word }}</a>
      </h2>
      {% if entry.is_favorite %}
        <span class="vault-favorite flex-shrink-0"><i class="bi bi-bookmark-star-fill" aria-hidden="true"></i><span class="visually-hidden">Favorite</span></span>
      {% endif %}
    </div>
    <p class="mb-2 vault-text">{{ entry.meaning|truncatechars:160 }}</p>
    <p class="vault-meta mb-0">Saved <time datetime="{{ entry.created_at|date:'c' }}">{{ entry.created_at|date:"M j, Y" }}</time></p>
  </div>
</article>
